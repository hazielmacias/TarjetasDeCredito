<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ede6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nuestras Finanzas" />
    <meta name="description" content="Tarjetas de crédito y gastos compartidos — para dos." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <title>Nuestras Finanzas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      /* Reglas inline criticas para garantizar layout PC correcto */
      @media (min-width: 768px) {
        #app {
          width: calc(100vw - 248px) !important;
          max-width: none !important;
          margin-left: 248px !important;
          margin-right: 0 !important;
          padding: 0 48px 64px !important;
          box-sizing: border-box !important;
        }
        .page {
          max-width: 1600px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-host" class="toast-host"></div>
    <div id="modal-host"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
